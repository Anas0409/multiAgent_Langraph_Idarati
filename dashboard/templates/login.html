<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Idarati Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Outfit', 'Inter', 'ui-sans-serif', 'sans-serif'] },
        colors: { brand: { 50:'#ecf3ff',100:'#dde9ff',500:'#465fff',600:'#3641f5' } }
      }}
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-50 font-sans flex items-center justify-center p-4">

<div class="w-full max-w-md">

  <!-- Logo / Brand -->
  <div class="text-center mb-8">
    <div class="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-brand-500 shadow-lg shadow-brand-500/30 mb-4">
      <svg class="fill-white" width="32" height="32" viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="white" stroke-width="1.5"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900">Idarati <span class="text-brand-500">v2</span></h1>
    <p class="mt-1 text-sm text-gray-500">Plateforme de réclamations administratives marocaines</p>
  </div>

  <!-- Card -->
  <div class="rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
    <h2 class="text-lg font-semibold text-gray-800 mb-6">Connexion au tableau de bord</h2>

    {% if error %}
    <div class="mb-5 flex items-center gap-3 rounded-xl border border-red-200 bg-red-50 px-4 py-3">
      <svg class="fill-red-500 shrink-0" width="16" height="16" viewBox="0 0 24 24">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2a10 10 0 110 20A10 10 0 0112 2zm0 5a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1zm0 8a1 1 0 100 2 1 1 0 000-2z"/>
      </svg>
      <span class="text-sm text-red-700">{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login_page') }}" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Identifiant</label>
        <input name="username" type="text" required autofocus
               placeholder="admin"
               class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm text-gray-800 outline-none
                      transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe</label>
        <input name="password" type="password" required
               placeholder="••••••••"
               class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm text-gray-800 outline-none
                      transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20">
      </div>
      <button type="submit"
              class="w-full rounded-xl bg-brand-500 px-4 py-3 text-sm font-semibold text-white
                     hover:bg-brand-600 transition-colors shadow-sm shadow-brand-500/20">
        Se connecter
      </button>
    </form>

    <div class="mt-6 rounded-xl bg-gray-50 border border-gray-100 px-4 py-3">
      <p class="text-xs text-gray-400 text-center">
        Compte par défaut : <span class="font-mono font-medium text-gray-600">admin / admin123</span>
      </p>
    </div>
  </div>

  <p class="mt-6 text-center text-xs text-gray-400">
    Idarati v2 — LangGraph · DeepSeek-R1 · SQLite
  </p>
</div>

</body>
</html>
