[project]
name = "idarati-v2"
version = "2.0.0"
description = "LangGraph Idarati v2 — Architecture Multi-Agent Complète"
requires-python = ">=3.11"

dependencies = [
    # Core LangGraph
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",

    # LLM
    "anthropic>=0.40.0",
    "openai>=1.50.0",

    # RAG / Vector Store
    "langchain-qdrant>=0.2.0",
    "qdrant-client>=1.12.0",

    # Mémoire / Checkpointer
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",

    # Cache Redis
    "redis>=5.0.0",
    "langchain-redis>=0.0.4",

    # Embeddings
    "sentence-transformers>=3.0.0",

    # Diffusion
    "twilio>=9.0.0",
    "aiosmtplib>=3.0.0",
    "httpx>=0.27.0",

    # Utilitaires
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=9.0.0",

    # Monitoring
    "langsmith>=0.1.0",
    "opentelemetry-sdk>=1.27.0",

    # Web Dashboard
    "flask>=3.0.0",
    "flask-login>=0.6.0",
    "flasgger>=0.9.7",
    "werkzeug>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.langgraph]
graphs = { idarati_v2 = "./graphs/main_graph.py:graph" }

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dashboard", "config", "database", "graphs", "utils"]
